<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:remove="all">Order Placement</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style type="text/css">
    body {
      font-family: calibri, 'DejaVu Sans', Arial, Helvetica, sans-serif;
    }
    a.link {
      border: solid 1px #000;
      background-color: #000;
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      display: block;
      width: 360px;
      text-align: center;
      padding: 10px 0;
    }
  </style>
</head>
<body>
<h1><b th:text="${subject}">subject</b></h1>
<div><b th:text="${content}">content</b> !</div>
<div>Thank you for trusting GaariGar <b th:text="${name}">name</b> !</div>
<p>
    <br/><br/>
    Your Order id:<b th:text="${orderId}">OrderId</b><br/>
    Order Type : <b th:text="${orderType}">OrderType</b><br/>
    Payment Method: <b th:text="${paymentMethod}">PaymentMethod</b><br/>
    <br/>
</p>
<br>
<p>
    <img src="static.images/logo.png" data-th-src="|cid:Logo|" height="80" />
</p>
<p>
    Regards, <br />
    &emsp; <em>The GaariGar Team</em>
</p>
</body>
</html>
