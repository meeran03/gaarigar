<!DOCTYPE html>
<html data-theme="bumblebee"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@2.36.1/dist/full.css" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>GaariGar | Unable to open page</title>
</head>
<body>
<div class="hero min-h-screen bg-base-200">
    <div class="hero-content text-center">
        <div class="max-w-md">
            <h1 class="text-5xl font-bold">This page is unavailable.</h1>
            <p class="py-6">The page may not exist, or your account may not have permission to use it.</p>
            <button
                    class="btn btn-primary"
                    th:onclick="|window.location.href='@{/admin/login}';|">Login
            </button>
        </div>
    </div>
</div>
</body>
</html>
