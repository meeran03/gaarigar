<!DOCTYPE html>
<html layout:decorator="layout" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <title>Edit Customer</title>
</head>

<body>
<section class="w-full" layout:fragment="content">
    <div class="w-full bg-base-200 card rounded-xl shadow-xl p-4">
        <div>
            <div class="flex items-center justify-between">
                <div class="text-2xl font-bold">Edit <span th:text="${userType}"></span></div>
            </div>
            <div>
                <form enctype="multipart/form-data" method="post"
                      th:action="@{/admin/{path}/update(path=${#strings.toLowerCase(userType)})}"
                      th:object="${user}"
                >
                    <input th:field="*{id}" type="hidden">
                    <div class="grid grid-cols-2 space-x-2 w-full">
                        <div class="divider w-full col-span-2"></div>
                        <span class="col-span-2 m-2 mt-0 text-sm text-gray-400">Personal Details</span>
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text">First Name</span>
                            </label>
                            <input class="input input-bordered input-sm rounded" th:field="*{firstName}"
                                   type="text">
                        </div>

                        <div class="form-control">
                            <label class="label">
                                <span class="label-text">Last Name</span>
                            </label>
                            <input class="input input-bordered input-sm rounded" th:field="*{lastName}" type="text">
                        </div>

                        <div class="form-control"
                             th:classappend="${userType != 'Customer' ? 'col-span-2' : ''}"
                        >
                            <label class="label">
                                <span class="label-text">Phone</span>
                            </label>
                            <input class="input input-bordered input-sm rounded" th:field="*{phone}" type="text">
                        </div>

                        <div class="form-control" th:if="${userType == 'Customer'}">
                            <label class="label">
                                <span class="label-text">Email</span>
                            </label>
                            <input class="input input-bordered input-sm rounded" th:field="*{email}" type="email">
                        </div>

                        <div class="form-control">
                            <label class="label">
                                <span class="label-text">Password</span>
                            </label>
                            <input class="input input-bordered input-sm rounded" th:field="*{password}"
                                   type="password">
                        </div>

                        <div class="form-control">
                            <label class="label">
                                <span class="label-text">Confirm Password</span>
                            </label>
                            <input class="input input-bordered input-sm rounded" th:field="*{confirmPassword}"
                                   type="password">
                        </div>

                        <div class="form-control ">
                            <label class="label">
                                <span class="label-text">Profile Image</span>
                            </label>
                            <input class="ile-input w-full max-w-xs" th:field="*{imageFile}"
                                   type="file">

                        </div>

                        <div class="mt-2">
                            <img
                                    class="rounded-full w-20 h-20"
                                    th:src="*{image}"/>
                        </div>

                        <div class="divider w-full col-span-2"></div>
                        <span class="col-span-2 m-2 mt-0 text-sm text-gray-400">Application Details</span>

                        <div class="form-control flex items-center justify-between flex-row ">
                            <label class="label-text pr-2">Is Active</label>
                            <input class="toggle" th:field="*{isActive}" type="checkbox"/>
                        </div>

                        <div class="form-control flex items-center justify-between flex-row ">
                            <label class="label-text pr-2">Is Verified</label>
                            <input class="toggle" th:field="*{isVerified}" type="checkbox"/>
                        </div>

                        <div class="form-control mt-4 flex items-center justify-between flex-row "
                             th:if="${userType != 'Customer'}">
                            <label class="label">
                                <span class="label-text">Is Available</span>
                            </label>
                            <input class="toggle" th:field="*{isAvailable}" type="checkbox"/>
                        </div>

                        <div class="form-control mt-4 flex items-center justify-between flex-row "
                             th:if="${userType == 'Mechanic'}">
                            <label class="label">
                                <span class="label-text">Mechanic Type</span>
                            </label>
                            <select class="select select-sm select-bordered" th:field="*{type}">
                                <option th:each="mType : ${T(com.gianteyes.gaarigar.mechanic.MechanicType).values()}"
                                        th:text="${mType}"
                                        th:value="${mType}"></option>
                            </select>
                        </div>

                        <div class="form-control mt-4"
                             th:if="${userType == 'PetrolPump'}">
                            <label class="label">
                                <span class="label-text">Petrol Pump Address</span>
                            </label>
                            <textarea class="textarea h-24 textarea-bordered textarea-sm rounded" th:field="*{address}"
                                      type="text"></textarea>
                        </div>

                        <div class="divider w-full col-span-2"></div>
                        <span class="col-span-2 m-2 mt-0 text-sm text-gray-400">Location Details</span>

                        <div class="form-control">
                            <label class="label">
                                <span class="label-text">Latitude</span>
                            </label>
                            <input class="input input-bordered input-sm rounded" step="any"
                                   th:field="*{location.latitude}"
                                   type="number"/>

                        </div>

                        <div class="form-control">
                            <label class="label">
                                <span class="label-text">Longitude</span>
                            </label>
                            <input class="input input-bordered input-sm rounded" step="any"
                                   th:field="*{location.longitude}"
                                   type="number"/>
                        </div>

                    </div>
                    <div class="form-control mt-2">
                        <button class="btn btn-primary text-white">Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
</body>

</html>
