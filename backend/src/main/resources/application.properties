server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/gaarigar}
spring.datasource.username=${PGUSER:gaarigar}
spring.datasource.password=${PGPASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/extensions.sql
spring.jackson.default-property-inclusion=non_null
jwt.secret=${JWT_SECRET}
redis.hostname=${REDISHOST:localhost}
redis.port=${REDISPORT:6379}
redis.password=${REDISPASSWORD:}
redis.username=${REDISUSER:default}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=${MAIL_FROM:noreply@example.invalid}
mail.from.name=GaariGar
accountSid=${TWILIO_ACCOUNT_SID:}
twilioAuthToken=${TWILIO_AUTH_TOKEN:}
twilioPhoneNumber=${TWILIO_PHONE_NUMBER:}
stripe.api.key=${STRIPE_SECRET_KEY:}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
gaarigar.integrations.enabled=${INTEGRATIONS_ENABLED:false}
gaarigar.sample-data=${SAMPLE_DATA:false}
gaarigar.admin.phone=${ADMIN_PHONE:+199955501000}
gaarigar.admin.password=${ADMIN_PASSWORD}
gaarigar.sample.password=${SAMPLE_PASSWORD:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.redis.enabled=false
management.health.mail.enabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true
