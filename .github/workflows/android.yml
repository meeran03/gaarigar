name: Build Android apps
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, mechanic, mechanic-prototype]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK platforms
        run: sdkmanager 'platforms;android-33' 'platforms;android-32' 'build-tools;30.0.3' 'build-tools;32.0.0' 'build-tools;33.0.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Assemble sample APK
        working-directory: apps/${{ matrix.app }}
        run: bash gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gaarigar-${{ matrix.app }}-debug
          path: apps/${{ matrix.app }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
